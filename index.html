<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.4 var(--fb);min-height:100vh;transition:background .25s}

@keyframes tw{50%{opacity:.45}}
h1,h2,h3{font-family:var(--fp);font-weight:700;margin:0;line-height:1.1;letter-spacing:.5px}
.px{image-rendering:pixelated;vertical-align:middle;display:inline-block}
.em{width:1.15em;height:1.15em;image-rendering:pixelated;vertical-align:-.2em}
nav{position:sticky;top:0;z-index:5;background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 10px 16px;box-shadow:0 4px 0 var(--edge),0 8px 18px rgba(0,0,0,.45)}
nav button{position:relative;border:0;background:var(--surf);color:var(--mut);font:700 14px var(--fb);padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--notch),inset 0 -4px 0 rgba(255,255,255,.1)}

.nl{position:absolute;top:-8px;right:-4px;background:#ff3b3b;color:#fff;font:700 12px var(--fb);padding:1px 6px;min-width:20px;text-align:center;box-shadow:var(--notch)}
main{max-width:860px;margin:0 auto;padding:22px 18px 70px}
.top h1{font-size:46px;color:var(--accent);text-shadow:-3px 0 var(--edge),3px 0 var(--edge),0 -3px var(--edge),0 3px var(--edge),3px 3px 0 var(--edge),-3px -3px 0 var(--edge),3px -3px 0 var(--edge),-3px 3px 0 var(--edge),0 6px 0 var(--edge),0 0 22px var(--glow)}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{border:0;background:#0a8a1f;color:#fff;font:700 19px var(--fp);padding:12px 26px;cursor:pointer;margin:6px;box-shadow:0 0 0 4px #f2b705,0 0 0 8px var(--edge),inset 0 -6px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.2);text-shadow:2px 2px 0 rgba(0,0,0,.45)}

.small{color:var(--mut);font-size:16px}
.warn{color:#ffb4b4;font-weight:600}
.card{background:var(--card);background-image:linear-gradient(var(--glow),var(--glow));background-size:100% 4px;background-repeat:no-repeat;padding:22px 18px;margin:0 4px 30px;box-shadow:var(--notch4),inset 0 -4px 0 rgba(0,0,0,.3),0 11px 0 0 rgba(0,0,0,.4),0 0 26px rgba(0,0,0,.35)}

.empty{color:var(--mut);padding:10px 0}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--line)}

.ts{border:0;background:none;cursor:pointer;padding:0 6px;vertical-align:middle}
.rk{color:var(--mut);font-size:14px;font-weight:500}
.tt{font-size:26px}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 12px}

.up{color:#7dff9b;font-size:14px;font-weight:700}.dn{color:#ff9a9a;font-size:14px;font-weight:700}

.m .t{color:var(--mut);font-size:16px}

.m .r{font:700 20px var(--fb);text-align:right}

table{width:100%;border-collapse:collapse;font-size:17px}
th{color:var(--mut);font-weight:600;font-size:14px;text-align:right;padding:6px 4px}
th:nth-child(2),td:nth-child(2){text-align:left}

.f1grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}

.f1grid div.me{background:var(--accent);color:var(--ink)}
.f1grid span{display:block;font-weight:700;font-size:19px}
.race{border-top:2px solid var(--line);padding:16px 0}

.race h3{font-size:24px}
.ses{font-size:15px;color:var(--mut);margin-top:4px}
.podium{margin-top:10px}.podium div{padding:3px 0;font-size:19px}
.facts{margin-top:12px;font-size:16px;color:var(--mut)}
.facts div{margin-top:6px}
.facts b{color:var(--tx)}
.err{background:#000;padding:16px;margin:18px 0}
.off{background:#3a2a00;color:#ffd98a;padding:8px 12px;margin:0 4px 18px;font-weight:600;box-shadow:var(--notch)}
.strip{display:flex;gap:14px;overflow-x:auto;padding:6px 6px 16px;margin:0 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tk{flex:0 0 auto;min-width:156px;background:var(--card);color:var(--tx);border:0;padding:8px 12px;text-align:left;cursor:pointer;font:600 16px var(--fb);box-shadow:var(--notch),inset 0 -4px 0 rgba(255,255,255,.1)}
.tk:active{transform:translateY(2px)}
.tk .l{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px}
.tk .r{display:flex;justify-content:space-between;gap:14px}
a.news{display:block;padding:12px 0;border-top:2px solid var(--line);color:var(--tx);text-decoration:none;font-weight:600}
a.news:first-of-type{border-top:0}
a.news:active{color:var(--accent)}
#upbtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:50px;height:50px;border:0;background:#0a8a1f;color:#fff;font:700 22px var(--fp);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;box-shadow:0 0 0 3px #f2b705,0 0 0 6px var(--edge)}
#upbtn.show{opacity:1;pointer-events:auto}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.toast{background:var(--card);color:var(--tx);padding:10px 16px;font:700 17px var(--fb);box-shadow:var(--notch4),0 8px 0 rgba(0,0,0,.4),0 0 20px var(--glow);max-width:90%;animation:tin .25s}
@keyframes tin{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
#ptr{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:19;background:var(--card);color:var(--accent);padding:6px 14px;font:700 15px var(--fb);opacity:0;pointer-events:none;box-shadow:var(--notch),0 0 14px var(--glow)}
@media (max-width:560px){.top h1{font-size:38px}.m{grid-template-columns:70px 1fr auto}.cal .d{width:96px;flex-basis:96px}nav button{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none!important}}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>

const STAR=[

  '..YYYYYYY..',
  '...YYYYY...',

  '.YYYY.YYYY.',
  '.YYY...YYY.',
  'YY.......YY'];
function pix(rows,pal,s=3){
  const h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>{let x=0;while(x<w){const c=row[x];if(c==='.'){x++;continue}let n=1;while(x+n<w&&row[x+n]===c)n++;r+=`<rect x="${x}" y="${y}" width="${n}" height="1" style="fill:${pal[c]}"/>`;x+=n}});
  return `<svg class="px" viewBox="0 0 ${w} ${h}" width="${w*s}" height="${h*s}" shape-rendering="crispEdges">${r}</svg>`;
}
const ico=k=>pix(ICONS[k].r,ICONS[k].p,3);
const ST=(on,s=2)=>pix(STAR,{Y:on?'var(--accent)':'rgba(255,255,255,.45)'},s);

/* ===== Ícono del bookmark / pantalla de inicio: CRIKO SPORT en pixeles ===== */
(function(){try{
  const FONT={
    C:['.XXX.','X...X','X....','X....','X....','X...X','.XXX.'],
    R:['XXXX.','X...X','X...X','XXXX.','X.X..','X..X.','X...X'],

    P:['XXXX.','X...X','X...X','XXXX.','X....','X....','X....'],
    T:['XXXXX','..X..','..X..','..X..','..X..','..X..','..X..']
  };
  const c=document.createElement('canvas');c.width=c.height=180;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  x.fillStyle='#ffd23f';x.fillRect(0,0,180,180);
  x.fillStyle='#101426';x.fillRect(6,6,168,168);
  ['#1e4e8c','#1f6b3e','#d40f14','#e8590c'].forEach((col,i)=>{x.fillStyle=col;x.fillRect(21+i*36,16,30,16)});
  const word=(t,x0,y0,u)=>{[...t].forEach((ch,i)=>{FONT[ch].forEach((row,ry)=>{[...row].forEach((v,rx)=>{if(v==='X')x.fillRect(x0+(i*6+rx)*u,y0+ry*u,u,u)})})})};
  x.fillStyle='#000000';word('CRIKO',21,47,5);
  x.fillStyle='#ffd23f';word('CRIKO',18,44,5);
  x.fillStyle='#000000';word('SPORT',48,98,3);
  x.fillStyle='#f4f7ff';word('SPORT',46,96,3);
  ['tenis','nfl','f1','futbol'].forEach((k,i)=>{
    ICONS[k].r.forEach((row,ry)=>{[...row].forEach((ch,rx)=>{if(ch!=='.'){x.fillStyle=ICONS[k].p[ch];x.fillRect(9+i*42+rx*3,132+ry*3,3,3)}})});
  });
  const u=c.toDataURL('image/png');
  let a=document.querySelector('link[rel="apple-touch-icon"]');
  if(!a){a=document.createElement('link');a.rel='apple-touch-icon';document.head.appendChild(a)}
  a.href=u;
  const i=document.getElementById('ico');i.type='image/png';i.href=u;
}catch{}})();

/* ===== Ajustes (colores nocturnos, letra, tamaño, emojis, zona horaria, alertas) ===== */
const THEMES={
  medianoche:{hoy:['#0a0e27','#151b45','#060919','#8ab4ff','#060919'],tenis:['#08122e','#10204f','#050b1f','#c6f432','#050b1f'],nfl:['#06150e','#0d2b1c','#040e09','#47e08a','#040e09'],f1:['#150609','#25101a','#0d0305','#ff5252','#0d0305'],futbol:['#150d05','#2a1a0a','#0d0803','#ffb938','#0d0803']},
  aurora:{hoy:['#0b1026','#1b1745','#070a1b','#c084fc','#070a1b'],tenis:['#061a24','#0b3140','#041016','#5eead4','#041016'],nfl:['#071a17','#0d332d','#04100e','#34d399','#04100e'],f1:['#1a0a2a','#2e1250','#0f0618','#f472b6','#0f0618'],futbol:['#1a1030','#2d1b55','#0e0820','#fbbf24','#0e0820']},

let EMOJI=null;
try{EMOJI=new RegExp('\\p{Regional_Indicator}{2}|(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F)(?:\\u200D(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F?))*','gu')}catch{}
const EMC={};
function emImg(ch){
  if(EMC[ch]!==undefined)return EMC[ch];
  let out=ch;
  try{
    const c=document.createElement('canvas');c.width=c.height=20;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.font='17px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign='center';x.textBaseline='middle';
    x.fillText(ch,10,11);
    const d=x.getImageData(0,0,20,20),a=d.data;
    let any=false;
    for(let i=0;i<a.length;i+=4){
      if(a[i+3]<110){a[i+3]=0;continue}
      any=true;a[i+3]=255;
      for(let j=0;j<3;j++)a[i+j]=Math.min(255,Math.round(a[i+j]/51)*51);
    }
    if(any){x.putImageData(d,0,0);out=`<img class="em" alt="${ch}" src="${c.toDataURL()}">`}
  }catch{}
  return EMC[ch]=out;
}

/* cuenta regresiva */
function cd(iso){
  const ms=new Date(iso)-Date.now();
  if(ms<=0)return 'ya empezó';
  const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
  return 'en '+(d?`${d} d ${h} h`:h?`${h} h ${mi} min`:`${mi} min`);
}

/* alertas: compara los datos nuevos contra los anteriores */
function snap(){const m={};evts().forEach(e=>{m[e.id]={s:e.state,sc:evScore(e),a:e.a,b:e.b,sep:e.sep,fav:e.fav}});return m}
function diffAlerts(prev,cur){
  const out=[];
  if(!SET.alert)return out;
  for(const id in cur){
    const c=cur[id],p=prev[id];
    if(!p||!c.fav)continue;
    const ic=id[0]==='f'?'⚽':id[0]==='n'?'🏈':'🎾';
    if(p.s==='pre'&&c.s==='in')out.push(`🔴 Empezó: ${c.a} ${c.sep} ${c.b}`);
    else if(c.s==='in'&&p.sc!==c.sc)out.push(`${ic} ${c.a} ${c.sc} ${c.b}`);
    else if(p.s!=='post'&&c.s==='post')out.push(`🏁 Final: ${c.a} ${c.sc} ${c.b}`);
  }
  return out;
}

/* resumen curioso (goles/puntos totales, mayor diferencia, más cerrado) */
function factsCard(title,list,unit){
  const ps=list.filter(e=>e.state==='post'&&e.as!=null&&e.bs!=null);
  if(!ps.length)return '';
  const tot=ps.reduce((a,e)=>a+e.as+e.bs,0);
  const best=f=>ps.reduce((b,e)=>(!b||f(e)>f(b)?e:b),null);
  const big=best(e=>Math.abs(e.as-e.bs)),hi=best(e=>e.as+e.bs);
  const cl=ps.filter(e=>e.as!==e.bs).reduce((b,e)=>(!b||Math.abs(e.as-e.bs)<Math.abs(b.as-b.bs)?e:b),null);
  const dr=ps.filter(e=>e.as===e.bs).length;
  const ln=e=>`${esc(e.a)} ${e.as}-${e.bs} ${esc(e.b)}`;
  return `<section class="card"><h2>📊 ${title}</h2><div class="facts">
  <div><b>${unit} totales:</b> ${tot} en ${ps.length} partidos (${(tot/ps.length).toFixed(1)} por partido)</div>
  ${Math.abs(big.as-big.bs)>0?`<div>💥 <b>Mayor diferencia:</b> ${ln(big)}</div>`:''}
  ${hi&&hi!==big?`<div>🔥 <b>Más ${unit.toLowerCase()} en un partido:</b> ${ln(hi)}</div>`:''}
  ${cl&&cl!==big?`<div>🎯 <b>Más cerrado:</b> ${ln(cl)}</div>`:''}
  ${unit==='Goles'?`<div>🤝 <b>Empates:</b> ${dr}</div>`:''}
  </div></section>`;
}

/* tarjeta "Mis equipos" (NFL y Fútbol): en vivo, siguiente, último y posición */
function gres(g,k){
  const home=norm(g.home.name)===k,me=home?g.home:g.away,op=home?g.away:g.home;
  const a=me.score??0,b=op.score??0;
  return {op:op.name,sep:home?'vs':'@',a,b,ic:a>b?'✅':a<b?'❌':'➖'};
}
function favTeamsCard(items,posFn){
  if(!FS.size)return `<section class="card"><h2>⭐ Mis equipos</h2><div class="sub">Toca la estrella junto a un equipo en las tablas de abajo y aquí verás su siguiente partido, su último resultado y su posición.</div></section>`;
  const rows=[...FS].map(k=>{
    const mine=items.filter(x=>norm(x.g.home.name)===k||norm(x.g.away.name)===k);
    if(!mine.length)return '';
    const f0=mine[0].g,name=norm(f0.home.name)===k?f0.home.name:f0.away.name;
    const live=mine.find(x=>x.g.state==='in');
    const nx=mine.filter(x=>x.g.state==='pre').sort((a,b)=>new Date(a.g.date)-new Date(b.g.date))[0];
    const pv=mine.filter(x=>x.g.state==='post').sort((a,b)=>new Date(b.g.date)-new Date(a.g.date))[0];
    let s='';
    if(live){const r=gres(live.g,k);s+=`<div class="s">🔴 En vivo: ${r.a}-${r.b} ${r.sep} ${esc(r.op)} · ${esc(live.g.detail||'')}</div>`}
    if(nx){const r=gres(nx.g,k);s+=`<div class="s">Siguiente: ${r.sep} ${esc(r.op)} · ${esc(cap(df(nx.g.date)))}, ${tf(nx.g.date)} · ${esc(nx.lg)}</div>`}
    if(pv){const r=gres(pv.g,k);s+=`<div class="s">Último: ${r.ic} ${r.a}-${r.b} ${r.sep} ${esc(r.op)}</div>`}
    const pos=posFn(k);
    return `<div class="row"><div class="b"><div class="n">${esc(name)}${pos?` <span class="rk">${esc(pos)}</span>`:''}</div>${s}</div>${nx&&!live?`<div class="cdbig">${cdSpan(nx.g.date)}</div>`:''}</div>`;
  }).join('');
  return rows?`<section class="card"><h2>⭐ Mis equipos</h2>${rows}</section>`:'';
}

/* insignia de categoría + escala de nivel (cuadritos vacíos = Challenger, 5 llenos = Grand Slam) */
function catLabel(cat,tour='ATP'){
  return cat==='GS'?'Grand Slam':cat==='FIN'?tour+' Finals':cat==='OTRO'?'Especial':cat==='CH'?'Challenger':(cat==='1000'&&tour==='ATP')?'Masters 1000':`${tour} ${cat}`;
}
function lvlDots(cat){
  if(!(cat in LV)||cat==='OTRO')return '';
  const n=LV[cat];let r='';
  for(let i=0;i<5;i++)r+=`<rect x="${i*7}" y="0" width="5" height="5" style="fill:${i<n?'var(--accent)':'rgba(255,255,255,.28)'}"/>`;
  return `<span class="lvl" title="Nivel ${n} de 5"><svg viewBox="0 0 33 5" width="50" height="8" shape-rendering="crispEdges">${r}</svg></span>`;
}
function catBadge(cat,tour='ATP'){
  if(!cat)return '';
  return `<span class="cat c-${cat}">${catLabel(cat,tour)}</span>${lvlDots(cat)}`;
}

  h+='</section>';

  if(live.length){

    h+=`<section class="card"><h2>🔴 En vivo ahora</h2>${live.slice(0,lim).map(evRow).join('')}${moreBtn('hl',live.length,8)}</section>`;

  /* selector de día con filtro por deporte */
  const dl=o=>o===0?'Hoy':o===-1?'Ayer':o===1?'Mañana':cap(new Date(Date.now()+o*864e5).toLocaleDateString('es-MX',{timeZone:TZ,weekday:'short',day:'numeric'}));
  const offs=[-3,-2,-1,0,1,2,3,4,5,6];

  const dayList=E.filter(e=>dk(e.date)===sel&&(ui.hsp==='all'||e.tab===ui.hsp)).sort((a,b)=>new Date(a.date)-new Date(b.date));

  <div class="chips">${[['all','Todos'],['tenis','Tenis'],['nfl','NFL'],['futbol','Fútbol']].map(([v,l])=>`<button class="chip" data-a="hsp" data-v="${v}" aria-pressed="${ui.hsp===v}">${l}</button>`).join('')}</div>`;
  h+=dayList.length?dayList.slice(0,lim).map(evRow).join('')+moreBtn('ha',dayList.length,10):'<div class="empty">No hay partidos para este día y deporte.</div>';

/* ---------- TENIS ---------- */
function dayLabel(iso){
  const k=dk(iso);
  return k===dayKey(0)?'Hoy':k===dayKey(1)?'Mañana':k===dayKey(-1)?'Ayer':cap(df(iso));
}
function rTenis(){
  const t=D?.tenis||{},rk=t.ranking||[],fav=favSet();
  const rankOf={};rk.forEach(r=>{rankOf[norm(r.name)]=r.rank});
  const keep=p=>{const n=norm(p.name),r=rankOf[n];
    if(ui.mode==='all')return r!=null;
    if(ui.mode==='top3')return r!=null&&r<=3;
    if(ui.mode==='top5')return r!=null&&r<=5;
    return fav.has(n)};
  const watch=m=>m.p.some(keep);
  /* sorpresa: un Top 20 pierde contra alguien fuera del Top 20 */
  const upset=m=>{if(m.state!=='post')return false;const w=m.p.find(p=>p.winner),l=m.p.find(p=>!p.winner);return !!(w&&l&&rankOf[norm(l.name)]!=null&&rankOf[norm(w.name)]==null)};
  const nameHtml=(p,m)=>{const r=rankOf[norm(p.name)],w=m.state==='post'&&p.winner;
    return `<span class="${w?'w':''}">${keep(p)?'<b>'+esc(p.name)+'</b>':esc(p.name)}${r?` <span class="rk">#${r}</span>`:''}${w?' ✓':''}</span>`};
  const row=m=>`<div class="m${fl('t'+m.id)}"><span class="t">${m.state==='pre'?tf(m.date):m.state==='in'?'<span class="live" style="margin:0">En vivo</span>':'Final'}</span><span class="x">${m.p.map(p=>nameHtml(p,m)).join(' vs ')}${(m.round||upset(m))?`<span class="i">${esc(m.round)}${upset(m)?' · 🔥 Sorpresa':''}</span>`:''}</span><span class="r">${m.state==='pre'?'':esc(m.score)}</span></div>`;
  const grouped=ms=>{let last='',h='';ms.forEach(m=>{const k=dk(m.date);if(k!==last){h+=`<div class="day">${dayLabel(m.date)}</div>`;last=k}h+=row(m)});return h};
  /* quién del Top 20 sigue vivo y quién ya quedó eliminado en cada torneo */
  const ao=tn=>{
    const al=new Set(),ou=new Set();
    (tn.matches||[]).forEach(m=>m.p.forEach(p=>{
      if(rankOf[norm(p.name)]==null)return;
      if(m.state!=='post'||p.winner)al.add(p.name);else ou.add(p.name);
    }));
    ou.forEach(n=>al.delete(n));
    const srt=s=>[...s].sort((a,b)=>rankOf[norm(a)]-rankOf[norm(b)]);
    return {al:srt(al),ou:srt(ou)};
  };
  const names=a=>a.length?a.map(n=>`${esc(n)} <span class="rk">#${rankOf[norm(n)]}</span>`).join(', '):'—';

  const tns=(t.tournaments||[]).map(tn=>{
    const ms=(tn.matches||[]).filter(watch);
    return {...tn,live:ms.filter(m=>m.state==='in'),next:ms.filter(m=>m.state==='pre'),done:ms.filter(m=>m.state==='post').reverse()};
  }).filter(tn=>tn.live.length||tn.next.length||tn.done.length);
  const nLive=tns.reduce((a,x)=>a+x.live.length,0),nNext=tns.reduce((a,x)=>a+x.next.length,0),nDone=tns.reduce((a,x)=>a+x.done.length,0);
  const desc={fav:'Partidos de tus estrellas',top3:'Partidos del Top 3',top5:'Partidos del Top 5',all:'Partidos de todo el Top 20'}[ui.mode];

  let h=header('Tenis');

  /* tarjeta de tus estrellas: jugando ahora + siguiente partido */
  const playing=[],mine=[];
  (t.tournaments||[]).forEach(tn=>(tn.matches||[]).forEach(m=>{
    if(!m.p.some(p=>fav.has(norm(p.name))))return;
    if(m.state==='in')playing.push({m,tn});
    if(m.state==='pre')mine.push({m,tn});
  }));
  mine.sort((a,b)=>new Date(a.m.date)-new Date(b.m.date));
  const vs=m=>m.p.map(p=>esc(p.name)).join(' vs ');
  if(playing.length||mine.length){
    h+=`<section class="card"><h2>⭐ Tus estrellas</h2>`;
    playing.forEach(x=>{h+=`<div class="row"><div class="b"><div class="n">🔴 ${vs(x.m)}</div><div class="s">${esc(x.tn.name)} · ${esc(x.m.round)} · ${esc(x.m.score)}</div></div><span class="live" style="margin:0">En vivo</span></div>`});
    if(mine[0]){const x=mine[0];h+=`<div class="row"><div class="b"><div class="s">Siguiente partido</div><div class="n">${vs(x.m)}</div><div class="s">${esc(x.tn.name)} · ${esc(x.m.round)} · ${cap(df(x.m.date))}, ${tf(x.m.date)}</div></div><div class="cdbig">${cdSpan(x.m.date)}</div></div>`}
    h+='</section>';
  }
  h+=newsCard('tenis');

  h+=`<section class="card"><h2>¿De quién quieres ver partidos?</h2><div class="sub">${desc}. Los torneos nuevos aparecen solos. Horario de ${esc(tzName())}.</div>
  <div class="chips">${[['fav',`${ST(1)} Mis estrellas`],['top3','Top 3'],['top5','Top 5'],['all','Top 20']].map(([v,l])=>`<button class="chip" data-a="mode" data-v="${v}" aria-pressed="${ui.mode===v}">${l}</button>`).join('')}</div>
  <div class="sum"><span>🔴 En vivo: <b>${nLive}</b></span><span>⏳ Por jugar: <b>${nNext}</b></span><span>✅ Terminados: <b>${nDone}</b></span></div></section>`;

  if(!tns.length)h+=`<section class="card"><div class="empty">${ui.mode==='fav'?'Tus estrellas no tienen partidos por ahora. Prueba «Top 5» o «Top 20», o marca más estrellas abajo.':'No hay partidos de este grupo por ahora.'}</div></section>`;
  tns.forEach((tn,i)=>{
    h+=`<section class="card"><h2 class="tt">${esc(tn.name)}${catBadge(tn.cat)}${tn.live.length?'<span class="live">En vivo</span>':''}</h2>`;
    if(tn.start)h+=`<div class="sub">${esc(range(tn.start,tn.end))}${PTS[tn.cat]?` · El campeón recibe ${PTS[tn.cat]} pts`:''}</div>`;
    const {al,ou}=ao(tn);
    if(al.length||ou.length)h+=`<div class="ao"><div><b>✅ Siguen (${al.length}):</b> ${names(al)}</div><div><b>❌ Eliminados (${ou.length}):</b> ${names(ou)}</div></div>`;
    if(tn.live.length)h+=`<div class="day">En vivo ahora</div>`+tn.live.map(row).join('');
    if(tn.next.length){
      const lim=ui.more['nx'+i]?999:8;
      h+=`<div class="day" style="margin-top:18px">Próximos partidos</div>`+grouped(tn.next.slice(0,lim))+moreBtn('nx'+i,tn.next.length,8,'Ver más próximos');
    }else if(!tn.live.length)h+=`<div class="empty">No hay más partidos por jugar de este grupo en este torneo.</div>`;
    if(tn.done.length){
      h+=`<button class="chip more" data-a="more" data-k="dn${i}">${ui.more['dn'+i]?'Ocultar resultados':`Ver resultados (${tn.done.length})`}</button>`;
      if(ui.more['dn'+i])h+=`<div class="day" style="margin-top:14px">Resultados</div>`+grouped(tn.done);
    }
    h+='</section>';
  });

  const fl2=r=>ui.rk==='all'||(ui.rk==='stars'&&fav.has(norm(r.name)))||(ui.rk==='top10'&&r.rank<=10)||(ui.rk==='11'&&r.rank>10);
  const list=rk.filter(fl2);
  h+=`<section class="card"><h2>Top 20 ATP</h2><div class="sub">Toca la estrella para elegir a quién sigues. ▲ y ▼ comparan con el ranking anterior.</div>
  <div class="chips">${[['all','Todos'],['stars','Mis estrellas'],['top10','Top 10'],['11','11 a 20']].map(([v,l])=>`<button class="chip" data-a="rk" data-v="${v}" aria-pressed="${ui.rk===v}">${l}</button>`).join('')}</div>
  <div class="small" style="margin-bottom:6px">Sigues a <b style="color:var(--accent)">${rk.filter(r=>fav.has(norm(r.name))).length}</b> de ${rk.length}. Mostrando ${list.length}.</div>`;
  if(!rk.length)h+='<div class="empty">Sin ranking por ahora.</div>';
  list.forEach(r=>{
    const on=fav.has(norm(r.name));
    const d=r.prev&&r.prev!==r.rank?(r.prev>r.rank?`<span class="up"> ▲${r.prev-r.rank}</span>`:`<span class="dn"> ▼${r.rank-r.prev}</span>`):'';
    h+=`<div class="row"><div class="k">${r.rank}</div><div class="b"><div class="n">${esc(r.name)}${d}</div><div class="s">${Number(r.pts).toLocaleString('en-US')} pts</div></div><button class="star ${on?'on':''}" data-a="star" data-n="${esc(norm(r.name))}" aria-label="Seguir a ${esc(r.name)}" aria-pressed="${on}">${ST(on,2)}</button></div>`;
  });
  h+='</section>';

  /* escala de niveles, del más bajo al más alto */
  h+=`<section class="card"><h2>Niveles de torneo</h2><div class="sub">Del más bajo al más alto. Los puntos son los que recibe el campeón.</div>`+
    ['CH','250','500','1000','FIN','GS'].map(c=>`<div class="leg"><span class="cat c-${c}" style="margin:0">${catLabel(c)}</span>${lvlDots(c)}<span class="p">${PTS[c]} pts</span></div>`).join('')+'</section>';

  /* calendario: filtro por nivel y orden */
  const nowMs=Date.now();
  const cal=(title,arr,key,tour)=>{
    if(!arr?.length)return '';
    let lst=arr.filter(c=>ui.cal==='all'||(ui.cal==='main'&&c.cat!=='CH')||c.cat===ui.cal);
    if(ui.sort==='up')lst=[...lst].sort((a,b)=>(LV[a.cat]??0)-(LV[b.cat]??0)||new Date(a.start)-new Date(b.start));
    if(ui.sort==='down')lst=[...lst].sort((a,b)=>(LV[b.cat]??0)-(LV[a.cat]??0)||new Date(a.start)-new Date(b.start));
    const lim=ui.more[key]?999:8;
    return `<section class="card"><h2>${title}</h2><div class="sub">Se actualiza solo. Hasta el US Open 2027.</div>`+
      (lst.length?lst.slice(0,lim).map(c=>`<div class="cal"><div class="d">${range(c.start,c.end)}</div><div><b>${esc(c.name)}</b>${catBadge(c.cat,tour)}${new Date(c.start).getTime()<=nowMs?'<span class="badge">En curso</span>':''}</div></div>`).join(''):`<div class="empty">${ui.cal==='CH'?'No hay datos de Challengers (ESPN quizá no los publica).':'No hay torneos de este nivel.'}</div>`)+
      moreBtn(key,lst.length,8)+'</section>';
  };
  if((t.calendarMen?.length)||(t.calendarWomen?.length)){
    h+=`<div class="chips">${[['main','Circuito ATP'],['CH','Challenger'],['250','250'],['500','500'],['1000','1000'],['FIN','Finals'],['GS','Grand Slam'],['all','Todos']].map(([v,l])=>`<button class="chip" data-a="cal" data-v="${v}" aria-pressed="${ui.cal===v}">${l}</button>`).join('')}</div>
    <div class="chips">${[['date','📅 Por fecha'],['up','▲ Nivel bajo a alto'],['down','▼ Nivel alto a bajo']].map(([v,l])=>`<button class="chip" data-a="sort" data-v="${v}" aria-pressed="${ui.sort===v}">${l}</button>`).join('')}</div>`;
  }
  h+=cal('Próximos torneos, hombres (ATP)',t.calendarMen,'calM','ATP')+cal('Próximos torneos, mujeres (WTA)',t.calendarWomen,'calW','WTA');
  return h;
}

/* ---------- NFL ---------- */
function visibleWeeks(){
  const now=Date.now();
  return (D?.nfl?.weeks||[]).filter(w=>{
    const gs=w.games||[];if(!gs.length)return false;
    if(!gs.every(g=>g.state==='post'))return true;
    const last=Math.max(...gs.map(g=>+new Date(g.date)));
    return now<last+28*36e5; // 4 h de partido + 24 h visibles
  });
}
function nflPos(k){
  for(const c of ['AFC','NFC']){
    const arr=D?.nfl?.standings?.[c]||[];
    const i=arr.findIndex(t=>norm(t.team)===k);
    if(i>=0){const t=arr[i];return `#${i+1} ${c} · ${t.w}-${t.l}${t.t?'-'+t.t:''}`}
  }
  return '';
}
function rNfl(){

    });
    h+='</section>';
    const ids=new Set(w.games.map(g=>'n'+g.id));
    h+=factsCard('Resumen de la semana',evts().filter(e=>e.tab==='nfl'&&ids.has(e.id)),'Puntos');
  }
  ['AFC','NFC'].forEach(c=>{
    const arr=n.standings?.[c]||[];
    h+=`<section class="card"><h2>${c}</h2><div class="sub">Récord de cada equipo (ganados-perdidos${arr.some(t=>t.t)?'-empates':''}). Los 7 de arriba entrarían a playoffs (aprox., sin contar divisiones ni desempates).</div>`;

    h+='</section>';
  });

}

    h+=`<section class="card"><h2>Clasificación</h2><div class="sub">${esc(q.name)} · ${esc(fechaLarga(q.date))}</div>
    <div class="podium"><div>🏁 Pole: <b>${esc(pole.name)}</b> <span class="small">${esc(pole.team)} · ${esc(best(pole))}</span></div>
    ${q.results[1]?`<div>2.º <b>${esc(q.results[1].name)}</b> <span class="small">${esc(q.results[1].team)} · ${esc(best(q.results[1]))}</span></div>`:''}
    ${q.results[2]?`<div>3.º <b>${esc(q.results[2].name)}</b> <span class="small">${esc(q.results[2].team)} · ${esc(best(q.results[2]))}</span></div>`:''}</div>
    ${w?`<div class="facts"><div>${w.name===pole.name?'✅ <b>Ganó desde la pole.</b>':`La carrera la ganó <b>${esc(w.name)}</b>, que no salió de la pole.`}</div></div>`:''}
    <table style="margin-top:14px"><thead><tr><th>#</th><th>Piloto</th><th>Mejor tiempo</th></tr></thead><tbody>${q.results.slice(0,ui.more.q?999:10).map(r=>`<tr><td>${esc(r.pos)}</td><td>${esc(r.name)}<div class="s">${esc(r.team)}</div></td><td>${esc(best(r))}<div class="s">${ph(r)}</div></td></tr>`).join('')}</tbody></table>${moreBtn('q',q.results.length,10,'Ver parrilla completa')}</section>`;
  }

  /* última carrera */
  if(f.last){
    const med=['🥇','🥈','🥉'],rs=f.last.results||[];
    const gd=d=>{
      if(d.grid==null)return '';
      if(d.grid===0)return ' · salió de pits';
      const diff=d.grid-Number(d.pos);
      return ` · salió ${d.grid}º${isNaN(diff)||diff===0?'':diff>0?` <span class="up">▲${diff}</span>`:` <span class="dn">▼${-diff}</span>`}`;
    };
    const dnfs=rs.filter(d=>d.status&&!/^(Finished|\+\d+ Lap)/i.test(d.status));
    const fin=rs.filter(d=>d.grid>0&&!isNaN(Number(d.pos))&&!dnfs.includes(d));
    const mover=fin.reduce((b,d)=>(d.grid-Number(d.pos)>(b?b.grid-Number(b.pos):0)?d:b),null);
    h+=`<section class="card"><h2>Última carrera</h2><div class="sub">${esc(f.last.name)} · ${esc(fechaLarga(f.last.date))}</div><div class="podium">${(f.last.podium||[]).map(p=>`<div>${med[p.pos-1]||p.pos+'.'} <b>${esc(p.name)}</b> <span class="small">${esc(p.team)}</span></div>`).join('')}</div>
    <div class="facts">
    ${f.last.fastest?`<div>🟣 <b>Vuelta rápida:</b> ${esc(f.last.fastest.name)} · ${esc(f.last.fastest.time)}</div>`:''}
    ${mover?`<div>🚀 <b>Más posiciones ganadas:</b> ${esc(mover.name)} (+${mover.grid-Number(mover.pos)})</div>`:''}
    ${dnfs.length?`<div>🚩 <b>Abandonos (${dnfs.length}):</b> ${dnfs.map(d=>`${esc(d.name)} (${esc(d.status)})`).join(', ')}</div>`:''}
    </div>`;
    if(rs.length)h+=`<table style="margin-top:14px"><thead><tr><th>#</th><th>Piloto</th><th>Tiempo</th><th>Pts</th></tr></thead><tbody>${rs.slice(0,ui.more.res?999:10).map(d=>`<tr><td>${esc(d.pos)}</td><td>${esc(d.name)}${d.fl?' 🟣':''}<div class="s">${esc(d.team)}${gd(d)}</div></td><td>${esc(d.time)}</td><td class="pts">${d.points}</td></tr>`).join('')}</tbody></table>${moreBtn('res',rs.length,10,'Ver resultado completo')}`;
    h+='</section>';
  }

  h+=`<section class="card"><h2>Próximas carreras</h2><div class="sub">Horario de la carrera en ${CITIES.length} ciudades (la tuya va resaltada).</div>`;
  if(!races.length)h+='<div class="empty">Sin carreras programadas por ahora.</div>';
  const lim=ui.more.races?999:3;
  races.slice(0,lim).forEach(r=>{
    const mx=/mexico/i.test(r.country);
    h+=`<div class="race"><h3>${mx?'🇲🇽 ':''}${esc(r.name)}${hasSprint(r)?'<span class="badge">⚡ Sprint</span>':''}</h3><div class="s">${esc(cap(df(r.race)))} · ${esc(r.place)}</div>`;
    h+=`<div class="ses"><b style="color:var(--tx)">Carrera</b></div>${cityTimes(r.race)}`;
    (r.sessions||[]).forEach(s=>{h+=`<div class="ses">${esc(s.name)}: ${esc(cap(df(s.at)))}, ${tf(s.at)} ${esc(tzName())}</div>`});
    h+='</div>';
  });
  h+=moreBtn('races',races.length,3)+'</section>';

  /* pilotos y chances de título */
  const ds=f.drivers||[];
  const lead=ds[0]?.points||0;
  const rem=races.length,spr=races.filter(hasSprint).length,maxPts=rem*25+spr*8;
  const vivos=ds.filter(d=>lead-d.points<=maxPts).length;
  h+=`<section class="card"><h2>Pilotos</h2><div class="sub">Quedan ${rem} carreras${spr?` (${spr} con sprint)`:''}: hay hasta ${maxPts} pts en juego. Con chances de título: <b style="color:var(--accent)">${vivos}</b> pilotos.</div>`;
  if(!ds.length)h+='<div class="empty">Sin tabla por ahora.</div>';
  else h+=`<table><thead><tr><th>#</th><th>Piloto</th><th>Gan.</th><th>Pts</th></tr></thead><tbody>${ds.slice(0,ui.more.drv?999:10).map(d=>{const gap=lead-d.points;return `<tr><td>${d.pos}</td><td>${flag(NAT[d.nationality])} ${esc(d.name)}<div class="s">${esc(d.team)}${d.pos>1?` · −${gap} del líder${gap>maxPts?' · sin chances de título':''}`:' · líder'}</div></td><td>${d.wins}</td><td class="pts">${d.points}</td></tr>`}).join('')}</tbody></table>${moreBtn('drv',ds.length,10,'Ver todos')}`;
  h+='</section>';

  /* constructores: de la API; si no hay, se calculan con los puntos de los pilotos */
  let cs=(f.constructors||[]).map(c=>[c.name,c.points]);
  const fromApi=cs.length>0;
  if(!fromApi){const tm={};ds.forEach(d=>{tm[d.team]=(tm[d.team]||0)+d.points});cs=Object.entries(tm).sort((a,b)=>b[1]-a[1])}
  if(cs.length){
    h+=`<section class="card"><h2>Constructores</h2><div class="sub">${fromApi?'Campeonato de constructores.':'Calculado sumando los puntos de los pilotos de cada equipo.'}</div><table><thead><tr><th>#</th><th>Equipo</th><th>Pts</th></tr></thead><tbody>${cs.slice(0,ui.more.con?999:10).map(([n,p],i)=>`<tr><td>${i+1}</td><td>${esc(n)}</td><td class="pts">${p}</td></tr>`).join('')}</tbody></table>${moreBtn('con',cs.length,10,'Ver todos')}</section>`;
  }
  return h;
}

/* ---------- FÚTBOL ---------- */
const lname=l=>`${l.cc?flag(l.cc)+' ':l.id.startsWith('uefa')?'🏆 ':''}${l.name}`;
function matchRow(g){
  const post=g.state==='post',pre=g.state==='pre';
  const nm=(t,w)=>w?`<b>${esc(t.name)}</b>`:esc(t.name);
  const right=pre?'':`${g.home.score??0} - ${g.away.score??0}`;
  const t=pre?tf(g.date):esc(post?'Final':g.detail||'En vivo');
  const f=isFav(g.home.name)||isFav(g.away.name);
  const gol=post&&Math.abs((g.home.score??0)-(g.away.score??0))>=4;
  return `<div class="m ${f?'fav':''}${fl('f'+g.id)}"><span class="t">${t}</span><span class="x">${nm(g.home,post&&g.home.winner)} vs ${nm(g.away,post&&g.away.winner)}${gol?' 🔥':''}</span><span class="r">${right}</span>${g.state==='in'?prog(g.detail):''}</div>`;
}
function futPos(k){
  const out=[];
  (D?.futbol?.ligas||[]).forEach(l=>{
    const t=(l.table||[]).find(x=>norm(x.team)===k);
    if(t)out.push(`${t.rank??'?'}º ${l.name} · ${t.pts} pts`);
  });
  return out.slice(0,2).join(' · ');
}
function rFutbol(){
  const ls=D?.futbol?.ligas||[];
  let h=header('Fútbol');
  if(!ls.length)return h+'<div class="card"><div class="empty">Todavía no hay datos.</div></div>';
  const items=ls.flatMap(l=>(l.matches||[]).map(g=>({g,lg:l.name})));
  h+=favTeamsCard(items,futPos);
  h+=newsCard('futbol');
  const tk=todayKey();
  const ok=g=>ui.fmode==='all'||(ui.fmode==='live'&&g.state==='in')||(ui.fmode==='fav'&&(isFav(g.home.name)||isFav(g.away.name)));
  const hoy=ls.map(l=>({l,g:(l.matches||[]).filter(g=>dk(g.date)===tk&&ok(g))})).filter(x=>x.g.length);
  const nLive=ls.reduce((a,l)=>a+(l.matches||[]).filter(g=>g.state==='in').length,0);
  h+=`<section class="card"><h2>Hoy en las ${ls.length} ligas</h2><div class="sub">Horario de ${esc(tzName())}. 🔥 es una goleada (4 o más goles de diferencia).</div>
  <div class="chips">${[['all','Todos'],['live',`🔴 En vivo (${nLive})`],['fav',`${ST(1)} Mis equipos`]].map(([v,l])=>`<button class="chip" data-a="fmode" data-v="${v}" aria-pressed="${ui.fmode===v}">${l}</button>`).join('')}</div>`;
  if(!hoy.length)h+=`<div class="empty">${ui.fmode==='live'?'No hay partidos en vivo ahorita.':ui.fmode==='fav'?'Tus equipos no juegan hoy (o aún no marcas ninguno).':'Hoy no hay partidos en estas ligas.'}</div>`;
  hoy.forEach(x=>{h+=`<div class="day">${esc(lname(x.l))}</div>`+x.g.map(matchRow).join('')});
  h+='</section>';
  h+=factsCard('Resumen de resultados recientes',evts().filter(e=>e.tab==='futbol'&&e.state==='post'&&Date.now()-new Date(e.date)<36*36e5),'Goles');
  if(ui.league>=ls.length)ui.league=0;
  const l=ls[ui.league];
  h+=`<div class="chips">${ls.map((x,i)=>{const n=(x.matches||[]).filter(g=>g.state==='in').length;return `<button class="chip" data-a="league" data-i="${i}" aria-pressed="${i===ui.league}">${esc(lname(x))}${n?` 🔴${n}`:''}</button>`}).join('')}</div>`;
  const ms=l.matches||[];
  const today=ms.filter(g=>dk(g.date)===tk);
  const next=ms.filter(g=>g.state==='pre'&&dk(g.date)>tk);
  const rec=ms.filter(g=>g.state==='post'&&dk(g.date)<=tk).reverse();
  h+=`<section class="card"><h2>${esc(lname(l))}: hoy</h2><div class="sub">Hora de ${esc(tzName())}.</div>${today.length?today.map(matchRow).join(''):'<div class="empty">Hoy no hay partidos de esta liga.</div>'}</section>`;
  h+=`<section class="card"><h2>Próximos</h2>`;
  if(!next.length)h+='<div class="empty">No hay partidos programados por ahora.</div>';
  else{let last='';next.slice(0,ui.more.nx?999:8).forEach(g=>{const k=dk(g.date);if(k!==last){h+=`<div class="day">${cap(df(g.date))}</div>`;last=k}h+=matchRow(g)});h+=moreBtn('nx',next.length,8)}
  h+='</section>';
  const tb=l.table||[];
  const z=ZN[l.id]||{top:4},rel=REL[l.id]||0;
  const zlab=z.lab||`Los 4 de arriba van resaltados${rel?`; los últimos ${rel} (en rojo) bajan`:''}.`;
  h+=`<section class="card"><h2>Tabla</h2><div class="sub">PJ son partidos jugados. DG es diferencia de goles. Pts son puntos. ${zlab} Zonas aproximadas. Toca la estrella para seguir un equipo.</div>`;
  if(!tb.length)h+='<div class="empty">Sin tabla por ahora.</div>';
  else h+=`<table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr></thead><tbody>${tb.slice(0,ui.more.tb?999:10).map((t,i)=>{const pos=t.rank??i+1;const cls=pos<=z.top?'hl':(z.po&&pos>=z.po[0]&&pos<=z.po[1])?'po':(rel&&pos>tb.length-rel)?'rel':'';return `<tr class="${cls}"><td>${pos}</td><td>${esc(t.team)}${ts(t.team)}</td><td>${t.pj}</td><td>${t.dg>0?'+':''}${t.dg}</td><td class="pts">${t.pts}</td></tr>`}).join('')}</tbody></table>${moreBtn('tb',tb.length,10,'Ver tabla completa')}`;
  h+='</section>';
  h+=`<section class="card"><h2>Resultados recientes</h2>`;
  h+=rec.length?rec.slice(0,ui.more.rc?999:8).map(matchRow).join('')+moreBtn('rc',rec.length,8):'<div class="empty">Sin resultados recientes.</div>';
  return h+'</section>';
}

/* ---------- App ---------- */
function render(){
  FS=favTeams();
  document.body.dataset.t=ui.tab;
  applyTheme();
  const lc=liveCounts();
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-a="tab" data-v="${k}" aria-selected="${k===ui.tab}"><span class="e">${ico(k)}</span>${l}${lc[k]?`<span class="nl">${lc[k]}</span>`:''}</button>`).join('');
  const app=document.getElementById('app');
  if(!D){app.innerHTML=err?`<div class="err">${esc(err)}</div><button class="btn" data-a="reload">Reintentar</button>`:'<p class="small">Cargando…</p>';return}
  app.innerHTML=P((ui.set?setCard():'')+(ui.tab==='hoy'?'':strip())+({hoy:rHoy,tenis:rTenis,nfl:rNfl,f1:rF1,futbol:rFutbol})[ui.tab]());
}
async function load(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo leer data.json ('+r.status+')');
    const nd=await r.json();
    FS=favTeams();
    const prev=D?snap():null;
    D=nd;err='';OFFLINE=false;
    try{localStorage.setItem('dh_cache',JSON.stringify(nd))}catch{}
    if(prev){
      const cur=snap();
      FLASH.clear();
      for(const id in cur){const p=prev[id],c=cur[id];if(p&&(p.sc!==c.sc||p.s!==c.s))FLASH.add(id)}
      diffAlerts(prev,cur).slice(0,4).forEach(toast);
      setTimeout(()=>FLASH.clear(),3500);
    }
  }catch(e){
    if(D){OFFLINE=true}
    else{
      let c=null;try{c=JSON.parse(localStorage.getItem('dh_cache')||'null')}catch{}
      if(c){D=c;OFFLINE=true}else err=e.message;
    }
  }
  render();
}

/* ===== Gestos: deslizar abajo = actualizar, deslizar a los lados = cambiar de pestaña ===== */
const G={x:0,y:0,on:false,t:null};
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){G.on=false;return}
  G.on=true;G.x=e.touches[0].clientX;G.y=e.touches[0].clientY;G.t=e.target;G.top=window.scrollY<=0;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!G.on||!G.top)return;
  const d=e.touches[0].clientY-G.y,dx=Math.abs(e.touches[0].clientX-G.x),el=document.getElementById('ptr');
  if(d>24&&dx<40){el.style.opacity=Math.min(1,d/90);el.textContent=d>90?'⟳ Suelta para actualizar':'↓ Desliza para actualizar'}
  else el.style.opacity=0;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!G.on)return;G.on=false;
  const t=e.changedTouches[0],dx=t.clientX-G.x,dy=t.clientY-G.y,el=document.getElementById('ptr');
  el.style.opacity=0;
  if(G.top&&dy>90&&Math.abs(dx)<50&&window.scrollY<=0){buzz(20);load();return}
  const blocked=G.t&&G.t.closest&&G.t.closest('.chips,.strip,table,input');
  if(!blocked&&Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*2){
    const i=TABS.findIndex(x=>x[0]===ui.tab),j=Math.max(0,Math.min(TABS.length-1,i+(dx<0?1:-1)));
    if(j!==i){ui.tab=TABS[j][0];location.hash=ui.tab;render();window.scrollTo(0,0)}
  }
},{passive:true});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,y=window.scrollY;
  if(a==='top'){window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='tab'){ui.tab=b.dataset.v;location.hash=ui.tab;render();window.scrollTo(0,0);return}
  if(a==='reload'){load();return}
  if(a==='settings'){ui.set=!ui.set;render();window.scrollTo(0,0);return}
  if(a==='set'){
    const k=b.dataset.k,v=b.dataset.v;
    SET[k]=(k==='size'||k==='alert')?+v:v;
    if(k==='tz')TZ=v;
    saveSet();render();window.scrollTo(0,y);return;
  }
  if(a==='star'){toggleStar(b.dataset.n);window.scrollTo(0,y);return}
  if(a==='tstar'){toggleTeam(b.dataset.n);window.scrollTo(0,y);return}
  if(a==='rk')ui.rk=b.dataset.v;
  if(a==='mode')ui.mode=b.dataset.v;
  if(a==='cal')ui.cal=b.dataset.v;
  if(a==='sort')ui.sort=b.dataset.v;
  if(a==='nmode')ui.nmode=b.dataset.v;
  if(a==='fmode')ui.fmode=b.dataset.v;
  if(a==='hsp')ui.hsp=b.dataset.v;
  if(a==='day')ui.dayOff=+b.dataset.v;
  if(a==='week'){ui.nflWeek=+b.dataset.w;ui.nflType=+b.dataset.ty}
  if(a==='league')ui.league=+b.dataset.i;
  if(a==='more')ui.more[b.dataset.k]=!ui.more[b.dataset.k];
  saveUI();
  render();window.scrollTo(0,y);
});
window.addEventListener('scroll',()=>document.getElementById('upbtn').classList.toggle('show',window.scrollY>700),{passive:true});
setInterval(load,10*60*1000);
setInterval(()=>{
  document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=cd(el.dataset.cd)});
  document.querySelectorAll('[data-ago]').forEach(el=>{el.textContent=ago(el.dataset.ago)});
},30000);
load();
</script>
