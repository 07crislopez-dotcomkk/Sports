<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Deportes hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e4e8c;--card:#163a6e;--nav:#163a6e;--accent:#dce94a;--ink:#0f2547;--tx:#f4f7ff;--mut:rgba(244,247,255,.66);--line:rgba(255,255,255,.14)}
body[data-t="nfl"]{--bg:#1f6b3e;--card:#164d2d;--nav:#154a2c;--accent:#ffc52e;--ink:#10301d}
body[data-t="f1"]{--bg:#d40f14;--card:#14161c;--nav:#14161c;--accent:#ffd23f;--ink:#14161c}
body[data-t="futbol"]{--bg:#e8590c;--card:#12203f;--nav:#12203f;--accent:#ffe066;--ink:#12203f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.4 'Barlow',system-ui,sans-serif;min-height:100vh;transition:background .25s}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;margin:0;line-height:1.05}
nav{position:sticky;top:0;z-index:5;background:var(--nav);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px max(8px,env(safe-area-inset-left))}
nav button{border:0;border-radius:14px;background:transparent;color:var(--mut);font:700 17px 'Barlow Condensed',sans-serif;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .e{font-size:26px;line-height:1}
nav button[aria-selected="true"]{background:var(--accent);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.top h1{font-size:64px}
.top .date{color:var(--mut);margin:6px 0 14px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--ink);font:700 18px 'Barlow',sans-serif;padding:12px 26px;cursor:pointer}
.small{color:var(--mut);font-size:15px}
.card{background:var(--card);padding:20px 18px;margin-bottom:18px}
.card h2{font-size:34px}
.card .sub{color:var(--mut);margin:6px 0 12px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--accent);background:transparent;color:var(--tx);border-radius:999px;font:600 16px 'Barlow',sans-serif;padding:7px 16px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.empty{color:var(--mut);padding:10px 0}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{font:800 30px 'Barlow Condensed',sans-serif;color:var(--accent);width:40px;text-align:center;flex:0 0 40px}
.row .b{flex:1;min-width:0}
.row .n{font-weight:600}
.row .s{color:var(--mut);font-size:14px}
.star{width:46px;height:46px;border-radius:50%;border:2px solid var(--mut);background:transparent;color:var(--mut);font-size:22px;cursor:pointer;flex:0 0 46px}
.star.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.rk{color:var(--mut);font-size:13px;font-weight:400}
.tt{font-size:30px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.sum span{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 14px;font-size:15px}
.up{color:#7dff9b;font-size:13px}.dn{color:#ff8f8f;font-size:13px}
.day{font:700 14px 'Barlow',sans-serif;color:var(--accent);margin:14px 0 2px}
.tn{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.tn:first-of-type{border-top:0;margin-top:6px}
.tn h3{font-size:28px}
.live{display:inline-block;background:var(--accent);color:var(--ink);font:700 12px 'Barlow',sans-serif;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.m{display:grid;grid-template-columns:78px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.m:first-of-type{border-top:0}
.m .t{color:var(--mut);font-size:15px}
.m .x{font-weight:400}
.m .x b{font-weight:700;color:var(--tx)}
.m .x .w{color:var(--accent)}
.m .r{font:700 18px 'Barlow Condensed',sans-serif;text-align:right}
.m .i{display:block;color:var(--mut);font-size:13px}
.cal{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.cal .d{color:var(--mut);width:118px;flex:0 0 118px;font-size:15px}
.cal b{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.badge{display:inline-block;background:var(--accent);color:var(--ink);font:700 12px 'Barlow',sans-serif;border-radius:999px;padding:2px 9px;margin-left:8px}
.more{display:block;margin:14px auto 0}
table{width:100%;border-collapse:collapse;font-size:16px}
th{color:var(--mut);font-weight:500;font-size:13px;text-align:right;padding:6px 4px}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:center;width:34px;color:var(--accent);font-weight:700}
tr.hl td:first-child{box-shadow:inset 3px 0 var(--accent)}
td.pts{font-weight:700}
.f1grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.f1grid div{background:rgba(255,255,255,.07);padding:8px 10px;font-size:14px}
.f1grid div.me{background:var(--accent);color:var(--ink)}
.f1grid span{display:block;font-weight:700;font-size:17px}
.race{border-top:1px solid var(--line);padding:16px 0}
.race:first-of-type{border-top:0}
.race h3{font-size:28px}
.ses{font-size:14px;color:var(--mut);margin-top:4px}
.podium{margin-top:10px}.podium div{padding:3px 0}
.err{background:#000;padding:16px;margin:18px 0}
@media (max-width:560px){.top h1{font-size:52px}.m{grid-template-columns:62px 1fr auto}.cal .d{width:96px;flex-basis:96px}}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body data-t="tenis">
<nav id="nav" role="tablist"></nav>
<main id="app"><p class="small">Cargando…</p></main>
<script>
const TZ='America/Hermosillo';
const CITIES=[['Hermosillo','America/Hermosillo'],['CDMX','America/Mexico_City'],['Madrid','Europe/Madrid'],['Buenos Aires','America/Argentina/Buenos_Aires'],['Nueva York','America/New_York'],['Londres','Europe/London']];
const TABS=[['tenis','🎾','Tenis'],['nfl','🏈','NFL'],['f1','🏎️','F1'],['futbol','⚽','Fútbol']];
const NAT={Italian:'IT',British:'GB',Dutch:'NL',Monegasque:'MC',Spanish:'ES',Australian:'AU',Thai:'TH',French:'FR',German:'DE',Canadian:'CA',Mexican:'MX',Japanese:'JP',Finnish:'FI',Chinese:'CN',Danish:'DK',Brazilian:'BR',Argentine:'AR',American:'US',"New Zealander":'NZ'};

let D=null, err='';
const ui={tab:(location.hash||'#tenis').slice(1),rk:'all',mode:'fav',nflWeek:null,league:0,more:{}};
if(!TABS.some(t=>t[0]===ui.tab))ui.tab='tenis';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const flag=cc=>cc?[...cc.toUpperCase()].map(c=>String.fromCodePoint(127397+c.charCodeAt(0))).join(''):'';
const tf=(iso,tz=TZ)=>new Date(iso).toLocaleTimeString('es-MX',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true});
const df=(iso,tz=TZ)=>new Date(iso).toLocaleDateString('es-MX',{timeZone:tz,weekday:'short',day:'numeric',month:'short'});
const dk=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:TZ});
const dshort=iso=>new Date(iso).toLocaleDateString('es-MX',{timeZone:'UTC',day:'numeric',month:'short'}).replace('.','');
const range=(a,b)=>{const x=dshort(a);if(!b)return x;const y=dshort(b);return x===y?x:`${x} a ${y}`};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const todayKey=()=>dk(new Date().toISOString());

function favSet(){
  try{const s=JSON.parse(localStorage.getItem('dh_stars2'));if(Array.isArray(s))return new Set(s)}catch{}
  return new Set((D?.tenis?.ranking||[]).slice(0,5).map(r=>norm(r.name)));
}
function toggleStar(n){const s=favSet();s.has(n)?s.delete(n):s.add(n);try{localStorage.setItem('dh_stars2',JSON.stringify([...s]))}catch{}render()}

function header(title){
  const d=cap(new Date().toLocaleDateString('es-MX',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}));
  const u=D?.updated?new Date(D.updated).toLocaleString('es-MX',{timeZone:TZ,day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}).replace('.','').replace(',',''):'sin datos';
  return `<div class="top"><h1>${title}</h1><div class="date">${d} · hora de Hermosillo</div>
  <div class="bar"><button class="btn" data-a="reload">Actualizar</button><span class="small">Datos de ${esc(u)}</span></div></div>`;
}
function moreBtn(key,total,shown,label='Ver más'){
  if(total<=shown&&!ui.more[key])return '';
  return `<button class="chip more" data-a="more" data-k="${key}">${ui.more[key]?'Ver menos':`${label} (${total-shown})`}</button>`;
}

/* ---------- TENIS ---------- */
function dayLabel(iso){
  const k=dk(iso),t=todayKey(),tm=dk(new Date(Date.now()+864e5).toISOString()),y=dk(new Date(Date.now()-864e5).toISOString());
  return k===t?'Hoy':k===tm?'Mañana':k===y?'Ayer':cap(df(iso));
}
function rTenis(){
  const t=D?.tenis||{},rk=t.ranking||[],fav=favSet();
  const rankOf={};rk.forEach(r=>{rankOf[norm(r.name)]=r.rank});
  const keep=p=>{const n=norm(p.name),r=rankOf[n];
    if(ui.mode==='all')return r!=null;
    if(ui.mode==='top3')return r!=null&&r<=3;
    if(ui.mode==='top5')return r!=null&&r<=5;
    return fav.has(n)};
  const watch=m=>m.p.some(keep);
  const nameHtml=(p,m)=>{const r=rankOf[norm(p.name)],w=m.state==='post'&&p.winner;
    return `<span class="${w?'w':''}">${keep(p)?'<b>'+esc(p.name)+'</b>':esc(p.name)}${r?` <span class="rk">#${r}</span>`:''}${w?' ✓':''}</span>`};
  const row=m=>`<div class="m"><span class="t">${m.state==='pre'?tf(m.date):m.state==='in'?'<span class="live" style="margin:0">En vivo</span>':'Final'}</span><span class="x">${m.p.map(p=>nameHtml(p,m)).join(' vs ')}${m.round?`<span class="i">${esc(m.round)}</span>`:''}</span><span class="r">${m.state==='pre'?'':esc(m.score)}</span></div>`;
  const grouped=ms=>{let last='',h='';ms.forEach(m=>{const k=dk(m.date);if(k!==last){h+=`<div class="day">${dayLabel(m.date)}</div>`;last=k}h+=row(m)});return h};

  const tns=(t.tournaments||[]).map(tn=>{
    const ms=(tn.matches||[]).filter(watch);
    return {...tn,live:ms.filter(m=>m.state==='in'),next:ms.filter(m=>m.state==='pre'),done:ms.filter(m=>m.state==='post').reverse()};
  }).filter(tn=>tn.live.length||tn.next.length||tn.done.length);
  const nLive=tns.reduce((a,x)=>a+x.live.length,0),nNext=tns.reduce((a,x)=>a+x.next.length,0),nDone=tns.reduce((a,x)=>a+x.done.length,0);
  const desc={fav:'Partidos de tus estrellas ★',top3:'Partidos del Top 3',top5:'Partidos del Top 5',all:'Partidos de todo el Top 20'}[ui.mode];

  let h=header('Tenis');
  h+=`<section class="card"><h2>¿De quién quieres ver partidos?</h2><div class="sub">${desc}. Los torneos nuevos aparecen solos. Horario de Hermosillo.</div>
  <div class="chips">${[['fav','★ Mis estrellas'],['top3','Top 3'],['top5','Top 5'],['all','Top 20']].map(([v,l])=>`<button class="chip" data-a="mode" data-v="${v}" aria-pressed="${ui.mode===v}">${l}</button>`).join('')}</div>
  <div class="sum"><span>🔴 En vivo: <b>${nLive}</b></span><span>⏳ Por jugar: <b>${nNext}</b></span><span>✅ Terminados: <b>${nDone}</b></span></div></section>`;

  if(!tns.length)h+=`<section class="card"><div class="empty">${ui.mode==='fav'?'Tus estrellas no tienen partidos por ahora. Prueba «Top 5» o «Top 20», o marca más estrellas abajo.':'No hay partidos de este grupo por ahora.'}</div></section>`;
  tns.forEach((tn,i)=>{
    h+=`<section class="card"><h2 class="tt">${esc(tn.name)}${tn.live.length?'<span class="live">En vivo</span>':''}</h2>`;
    if(tn.start)h+=`<div class="sub">${esc(range(tn.start,tn.end))}</div>`;
    if(tn.live.length)h+=`<div class="day">En vivo ahora</div>`+tn.live.map(row).join('');
    if(tn.next.length){
      const lim=ui.more['nx'+i]?999:8;
      h+=`<div class="day" style="font-size:16px;margin-top:18px">Próximos partidos</div>`+grouped(tn.next.slice(0,lim))+moreBtn('nx'+i,tn.next.length,8,'Ver más próximos');
    }else if(!tn.live.length)h+=`<div class="empty">No hay más partidos por jugar de este grupo en este torneo.</div>`;
    if(tn.done.length){
      h+=`<button class="chip more" data-a="more" data-k="dn${i}">${ui.more['dn'+i]?'Ocultar resultados':`Ver resultados (${tn.done.length})`}</button>`;
      if(ui.more['dn'+i])h+=`<div class="day" style="font-size:16px;margin-top:14px">Resultados</div>`+grouped(tn.done);
    }
    h+='</section>';
  });

  const fl=r=>ui.rk==='all'||(ui.rk==='stars'&&fav.has(norm(r.name)))||(ui.rk==='top10'&&r.rank<=10)||(ui.rk==='11'&&r.rank>10);
  const list=rk.filter(fl);
  h+=`<section class="card"><h2>Top 20 ATP</h2><div class="sub">Toca la estrella para elegir a quién sigues. ▲ y ▼ comparan con el ranking anterior.</div>
  <div class="chips">${[['all','Todos'],['stars','Mis estrellas'],['top10','Top 10'],['11','11 a 20']].map(([v,l])=>`<button class="chip" data-a="rk" data-v="${v}" aria-pressed="${ui.rk===v}">${l}</button>`).join('')}</div>
  <div class="small" style="margin-bottom:6px">Sigues a <b style="color:var(--accent)">${rk.filter(r=>fav.has(norm(r.name))).length}</b> de ${rk.length}. Mostrando ${list.length}.</div>`;
  if(!rk.length)h+='<div class="empty">Sin ranking por ahora.</div>';
  list.forEach(r=>{
    const on=fav.has(norm(r.name));
    const d=r.prev&&r.prev!==r.rank?(r.prev>r.rank?`<span class="up"> ▲${r.prev-r.rank}</span>`:`<span class="dn"> ▼${r.rank-r.prev}</span>`):'';
    h+=`<div class="row"><div class="k">${r.rank}</div><div class="b"><div class="n">${esc(r.name)}${d}</div><div class="s">${Number(r.pts).toLocaleString('en-US')} pts</div></div><button class="star ${on?'on':''}" data-a="star" data-n="${esc(norm(r.name))}" aria-label="Seguir a ${esc(r.name)}" aria-pressed="${on}">${on?'★':'☆'}</button></div>`;
  });
  h+='</section>';

  const nowMs=Date.now();
  const cal=(title,arr,key)=>{
    if(!arr?.length)return '';
    const lim=ui.more[key]?999:8;
    return `<section class="card"><h2>${title}</h2><div class="sub">Se actualiza solo. Hasta el US Open 2027.</div>`+arr.slice(0,lim).map(c=>`<div class="cal"><div class="d">${range(c.start,c.end)}</div><div><b>${esc(c.name)}</b>${new Date(c.start).getTime()<=nowMs?'<span class="badge">En curso</span>':''}${c.big?`<span class="badge">${esc(c.big)}</span>`:''}</div></div>`).join('')+moreBtn(key,arr.length,8)+'</section>';
  };
  h+=cal('Próximos torneos, hombres (ATP)',t.calendarMen,'calM')+cal('Próximos torneos, mujeres (WTA)',t.calendarWomen,'calW');
  return h;
}

/* ---------- NFL ---------- */
function visibleWeeks(){
  const now=Date.now();
  return (D?.nfl?.weeks||[]).filter(w=>{
    const gs=w.games||[];if(!gs.length)return false;
    if(!gs.every(g=>g.state==='post'))return true;
    const last=Math.max(...gs.map(g=>+new Date(g.date)));
    return now<last+28*36e5; // 4 h de partido + 24 h visibles
  });
}
function rNfl(){
  const n=D?.nfl||{};
  let h=header('NFL');
  const ws=visibleWeeks();
  if(!ws.length)h+='<div class="card"><div class="empty">Sin partidos por ahora.</div></div>';
  else{
    if(!ws.some(w=>w.week===ui.nflWeek&&w.type===ui.nflType)){ui.nflWeek=ws[0].week;ui.nflType=ws[0].type}
    const w=ws.find(x=>x.week===ui.nflWeek&&x.type===ui.nflType);
    const fin=w.games.every(g=>g.state==='post');
    h+=`<section class="card"><h2>${esc(w.label)}</h2><div class="sub">${fin?'Semana terminada: los resultados se quedan 24 horas.':'Horario de Hermosillo.'}</div>
    <div class="chips">${ws.map(x=>`<button class="chip" data-a="week" data-w="${x.week}" data-ty="${x.type}" aria-pressed="${x===w}">${esc(x.label)}</button>`).join('')}</div>`;
    let last='';
    w.games.forEach(g=>{
      const k=dk(g.date);
      if(k!==last){h+=`<div class="day">${cap(df(g.date))}</div>`;last=k}
      const a=g.away,b=g.home,post=g.state==='post';
      const nm=(t,win)=>`<span class="${win?'w':''}">${win?'<b>'+esc(t.name)+'</b>':esc(t.name)}${t.record?` <span class="s small">(${esc(t.record)})</span>`:''}</span>`;
      const right=g.state==='pre'?'':`${a.score??0} - ${b.score??0}`;
      h+=`<div class="m"><span class="t">${g.state==='pre'?tf(g.date):esc(post?'Final':g.detail||'En vivo')}</span><span class="x">${nm(a,post&&a.winner)} @ ${nm(b,post&&b.winner)}</span><span class="r">${right}</span></div>`;
    });
    h+='</section>';
  }
  ['AFC','NFC'].forEach(c=>{
    const arr=n.standings?.[c]||[];
    h+=`<section class="card"><h2>${c}</h2><div class="sub">Récord de cada equipo (ganados-perdidos${arr.some(t=>t.t)?'-empates':''}).</div>`;
    if(!arr.length)h+='<div class="empty">Sin tabla por ahora.</div>';
    else h+=`<table><thead><tr><th>#</th><th>Equipo</th><th>Récord</th><th>%</th></tr></thead><tbody>${arr.map((t,i)=>`<tr class="${i<4?'hl':''}"><td>${i+1}</td><td>${esc(t.team)}</td><td class="pts">${t.w}-${t.l}${t.t?'-'+t.t:''}</td><td>${(t.pct||0).toFixed(3).replace(/^0/,'')}</td></tr>`).join('')}</tbody></table>`;
    h+='</section>';
  });
  return h;
}

/* ---------- F1 ---------- */
function cityTimes(iso){
  return `<div class="f1grid">${CITIES.map(([n,tz],i)=>`<div class="${i===0?'me':''}">${n}<span>${tf(iso,tz)}</span>${df(iso,tz)}</div>`).join('')}</div>`;
}
function rF1(){
  const f=D?.f1||{};
  let h=header('Fórmula 1');
  if(f.last){
    h+=`<section class="card"><h2>Última carrera</h2><div class="sub">${esc(f.last.name)} · ${esc(new Date(f.last.date+'T12:00:00Z').toLocaleDateString('es-MX',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'}))}</div><div class="podium">${(f.last.podium||[]).map(p=>`<div>${p.pos}. <b>${esc(p.name)}</b> <span class="small">${esc(p.team)}</span></div>`).join('')}</div>`;
    const rs=f.last.results||[];
    if(rs.length)h+=`<table style="margin-top:14px"><thead><tr><th>#</th><th>Piloto</th><th>Tiempo</th><th>Pts</th></tr></thead><tbody>${rs.slice(0,ui.more.res?999:10).map(d=>`<tr><td>${esc(d.pos)}</td><td>${esc(d.name)}<div class="s small">${esc(d.team)}</div></td><td>${esc(d.time)}</td><td class="pts">${d.points}</td></tr>`).join('')}</tbody></table>${moreBtn('res',rs.length,10,'Ver resultado completo')}`;
    h+='</section>';
  }
  const races=f.races||[];
  h+=`<section class="card"><h2>Próximas carreras</h2><div class="sub">Horario de la carrera en Hermosillo y 5 ciudades.</div>`;
  if(!races.length)h+='<div class="empty">Sin carreras programadas por ahora.</div>';
  const lim=ui.more.races?999:3;
  races.slice(0,lim).forEach(r=>{
    const mx=/mexico/i.test(r.country);
    h+=`<div class="race"><h3>${mx?'🇲🇽 ':''}${esc(r.name)}</h3><div class="s small">${esc(cap(df(r.race)))} · ${esc(r.place)}</div>`;
    h+=`<div class="ses"><b style="color:var(--tx)">Carrera</b></div>${cityTimes(r.race)}`;
    (r.sessions||[]).forEach(s=>{h+=`<div class="ses">${esc(s.name)}: ${esc(cap(df(s.at)))}, ${tf(s.at)} Hermosillo</div>`});
    h+='</div>';
  });
  h+=moreBtn('races',races.length,3)+'</section>';
  const ds=f.drivers||[];
  h+=`<section class="card"><h2>Pilotos</h2><div class="sub">Puntos del campeonato.</div>`;
  if(!ds.length)h+='<div class="empty">Sin tabla por ahora.</div>';
  else h+=`<table><thead><tr><th>#</th><th>Piloto</th><th>Gan.</th><th>Pts</th></tr></thead><tbody>${ds.slice(0,ui.more.drv?999:10).map(d=>`<tr><td>${d.pos}</td><td>${flag(NAT[d.nationality])} ${esc(d.name)}<div class="s small">${esc(d.team)}</div></td><td>${d.wins}</td><td class="pts">${d.points}</td></tr>`).join('')}</tbody></table>${moreBtn('drv',ds.length,10,'Ver todos')}`;
  return h+'</section>';
}

/* ---------- FÚTBOL ---------- */
const lname=l=>`${l.cc?flag(l.cc)+' ':l.id.startsWith('uefa')?'🏆 ':''}${l.name}`;
function matchRow(g){
  const post=g.state==='post',pre=g.state==='pre';
  const nm=(t,w)=>w?`<b>${esc(t.name)}</b>`:esc(t.name);
  const right=pre?'':`${g.home.score??0} - ${g.away.score??0}`;
  const t=pre?tf(g.date):esc(post?'Final':g.detail||'En vivo');
  return `<div class="m"><span class="t">${t}</span><span class="x">${nm(g.home,post&&g.home.winner)} vs ${nm(g.away,post&&g.away.winner)}</span><span class="r">${right}</span></div>`;
}
function rFutbol(){
  const ls=D?.futbol?.ligas||[];
  let h=header('Fútbol');
  if(!ls.length)return h+'<div class="card"><div class="empty">Todavía no hay datos.</div></div>';
  const tk=todayKey();
  const hoy=ls.map(l=>({l,g:(l.matches||[]).filter(g=>dk(g.date)===tk)})).filter(x=>x.g.length);
  h+=`<section class="card"><h2>Hoy en las ${ls.length} ligas</h2><div class="sub">Horario de Hermosillo.</div>`;
  if(!hoy.length)h+='<div class="empty">Hoy no hay partidos en estas ligas.</div>';
  hoy.forEach(x=>{h+=`<div class="day">${esc(lname(x.l))}</div>`+x.g.map(matchRow).join('')});
  h+='</section>';
  if(ui.league>=ls.length)ui.league=0;
  const l=ls[ui.league];
  h+=`<div class="chips">${ls.map((x,i)=>`<button class="chip" data-a="league" data-i="${i}" aria-pressed="${i===ui.league}">${esc(lname(x))}</button>`).join('')}</div>`;
  const ms=l.matches||[];
  const today=ms.filter(g=>dk(g.date)===tk);
  const next=ms.filter(g=>g.state==='pre'&&dk(g.date)>tk);
  const rec=ms.filter(g=>g.state==='post'&&dk(g.date)<=tk).reverse();
  h+=`<section class="card"><h2>${esc(lname(l))}: hoy</h2><div class="sub">Hora de Hermosillo.</div>${today.length?today.map(matchRow).join(''):'<div class="empty">Hoy no hay partidos de esta liga.</div>'}</section>`;
  h+=`<section class="card"><h2>Próximos</h2>`;
  if(!next.length)h+='<div class="empty">No hay partidos programados por ahora.</div>';
  else{let last='';next.slice(0,ui.more.nx?999:8).forEach(g=>{const k=dk(g.date);if(k!==last){h+=`<div class="day">${cap(df(g.date))}</div>`;last=k}h+=matchRow(g)});h+=moreBtn('nx',next.length,8)}
  h+='</section>';
  const tb=l.table||[];
  h+=`<section class="card"><h2>Tabla</h2><div class="sub">PJ son partidos jugados. DG es diferencia de goles. Pts son puntos. Los 4 de arriba van resaltados.</div>`;
  if(!tb.length)h+='<div class="empty">Sin tabla por ahora.</div>';
  else h+=`<table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr></thead><tbody>${tb.slice(0,ui.more.tb?999:10).map((t,i)=>`<tr class="${i<4?'hl':''}"><td>${t.rank??i+1}</td><td>${esc(t.team)}</td><td>${t.pj}</td><td>${t.dg>0?'+':''}${t.dg}</td><td class="pts">${t.pts}</td></tr>`).join('')}</tbody></table>${moreBtn('tb',tb.length,10,'Ver tabla completa')}`;
  h+='</section>';
  h+=`<section class="card"><h2>Resultados recientes</h2>`;
  h+=rec.length?rec.slice(0,ui.more.rc?999:8).map(matchRow).join('')+moreBtn('rc',rec.length,8):'<div class="empty">Sin resultados recientes.</div>';
  return h+'</section>';
}

/* ---------- App ---------- */
function render(){
  document.body.dataset.t=ui.tab;
  document.getElementById('nav').innerHTML=TABS.map(([k,e,l])=>`<button role="tab" data-a="tab" data-v="${k}" aria-selected="${k===ui.tab}"><span class="e">${e}</span>${l}</button>`).join('');
  const app=document.getElementById('app');
  if(!D){app.innerHTML=err?`<div class="err">${esc(err)}</div><button class="btn" data-a="reload">Reintentar</button>`:'<p class="small">Cargando…</p>';return}
  app.innerHTML=({tenis:rTenis,nfl:rNfl,f1:rF1,futbol:rFutbol})[ui.tab]();
}
async function load(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo leer data.json ('+r.status+')');
    D=await r.json();err='';
  }catch(e){err=e.message;}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,y=window.scrollY;
  if(a==='tab'){ui.tab=b.dataset.v;location.hash=ui.tab;render();window.scrollTo(0,0);return}
  if(a==='reload'){load();return}
  if(a==='star'){toggleStar(b.dataset.n);window.scrollTo(0,y);return}
  if(a==='rk')ui.rk=b.dataset.v;
  if(a==='mode')ui.mode=b.dataset.v;
  if(a==='week'){ui.nflWeek=+b.dataset.w;ui.nflType=+b.dataset.ty}
  if(a==='league')ui.league=+b.dataset.i;
  if(a==='more')ui.more[b.dataset.k]=!ui.more[b.dataset.k];
  render();window.scrollTo(0,y);
});
setInterval(load,10*60*1000);
load();
</script>
</body>
</html>
