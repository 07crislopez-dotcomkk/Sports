name: Actualizar datos

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (hora UTC)
  workflow_dispatch:         # botón manual en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bajar datos
        run: node scripts/update.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git pull --rebase && git push)
